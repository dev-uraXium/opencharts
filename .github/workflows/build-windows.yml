name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: Draft release tag that holds charts.bin
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private chart bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p private
          gh release download "${{ inputs.bundle_tag }}" -p 'charts.bin*' -p key.rs -D private
          if [ ! -f private/charts.bin ]; then cat private/charts.bin.part* > private/charts.bin; fi
          test -s private/key.rs
      - name: Build
        run: cargo build --release
      - name: Installer
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p target/x86_64-pc-windows-gnu/release
          cp target/release/opencharts.exe target/x86_64-pc-windows-gnu/release/openCharts.exe
          MK="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -x "$MK" ]; then choco install nsis -y --no-progress; fi
          "$MK" -DVERSION=$VER installer/opencharts.nsi
          mkdir out
          cp target/release/opencharts.exe out/openCharts.exe
          cp target/openCharts-Setup.exe out/
          cp out/openCharts.exe out/OpenPlates.exe
          cp out/openCharts-Setup.exe out/OpenPlates-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: opencharts-windows
          path: out/*
